<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recanta Explorer</title>
<script src="/vendor/cytoscape.min.js"></script>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
    --fg:#e6edf3; --dim:#8b95a5; --accent:#5cc8ff; --accent2:#a371f7;
    --green:#3fb950; --amber:#d29922; --teal:#56d4c4; --pink:#f778ba; --gray:#8b95a5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:14px;margin:0}
  header h1 b{color:var(--accent)}
  #meta{color:var(--dim);font-size:11px;display:flex;gap:12px;flex-wrap:wrap}
  #meta .k{color:var(--fg)}
  .pill{padding:1px 7px;border:1px solid var(--line);border-radius:10px}
  #bar{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  #q{flex:0 0 280px;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--fg);font:inherit}
  #q:focus{outline:none;border-color:var(--accent)}
  #filters,#efilters,#pfilters{display:flex;gap:6px;flex-wrap:wrap}
  .chip .sq{width:9px;height:9px;border-radius:2px}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
  .chip{font-size:11px;padding:2px 9px;border:1px solid var(--line);border-radius:11px;cursor:pointer;color:var(--dim);user-select:none;display:flex;align-items:center;gap:5px}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip .bar{width:13px;height:2px;border-radius:2px}
  .chip.off{opacity:.35;text-decoration:line-through}
  #count{color:var(--dim);font-size:11px;margin-left:auto}
  #stage{position:relative;height:calc(100vh - 49px - 41px);overflow:hidden}
  #cy{width:100%;height:100%;background:var(--bg)}
  #side{position:absolute;top:0;right:0;width:380px;max-width:80%;height:100%;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px;transform:translateX(100%);transition:transform .15s ease}
  #side.open{transform:translateX(0)}
  #side h3{margin:0 0 4px;font-size:15px;word-break:break-word}
  #side .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
  #side pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px;margin:8px 0;font-size:12px}
  #side .meta{color:var(--dim);font-size:12px;margin:12px 0 6px}
  #side ul{margin:4px 0;padding-left:18px}
  #side li{color:var(--dim);font-size:12px;cursor:pointer}
  #side li:hover{color:var(--accent)}
  #close{position:absolute;top:10px;right:12px;color:var(--dim);cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1><b>Recanta</b> Explorer</h1>
  <div id="meta">loading…</div>
</header>
<div id="bar">
  <input id="q" placeholder="Search & focus nodes…" autocomplete="off">
  <div id="pfilters"></div>
  <span class="sep" id="psep" style="display:none"></span>
  <div id="filters"></div>
  <span class="sep"></span>
  <div id="efilters"></div>
  <span id="count"></span>
</div>
<div id="stage">
  <div id="cy"></div>
  <div id="loading">building graph…</div>
  <aside id="side"><span id="close">esc</span><div id="detail"></div></aside>
</div>
<script>
// Detail panel content is built with DOM APIs + textContent (never innerHTML), so
// ingested code/docs/transcripts can't inject markup. Graph labels render on canvas.
const api = async p => (await fetch(p)).json();
const KIND = {
  function:{c:'#5cc8ff',label:'function'}, method:{c:'#5cc8ff',label:'method'},
  class:{c:'#a371f7',label:'class'}, struct:{c:'#a371f7',label:'struct'},
  enum:{c:'#a371f7',label:'enum'}, trait:{c:'#a371f7',label:'trait'}, interface:{c:'#a371f7',label:'interface'},
  module:{c:'#56d4c4',label:'module/file'}, document:{c:'#3fb950',label:'document'},
  memory:{c:'#f778ba',label:'memory'}, session:{c:'#d29922',label:'session'}, commit:{c:'#8b95a5',label:'commit'},
};
const EDGE = { DEFINES:'#39414f', IMPORTS:'#3d6fa3', CALLS:'#5cc8ff', CHANGED_BY:'#9e6a26', EVIDENCE:'#a13d6e', MENTIONS:'#2f6f43', RELATED:'#6a4da8' };
// Per-project tint palette (assigned by index) for the project filter chips.
const PROJECT_PALETTE = ['#5cc8ff','#a371f7','#3fb950','#d29922','#f778ba','#56d4c4','#ff7b72','#bc8cff','#79c0ff','#e3b341'];
const projectColor = {};
const el=(t,o={},k=[])=>{const n=document.createElement(t);if(o.class)n.className=o.class;if(o.text!=null)n.textContent=o.text;if(o.onClick)n.addEventListener('click',o.onClick);for(const c of k)if(c)n.appendChild(c);return n;};
const clear=n=>{while(n.firstChild)n.removeChild(n.firstChild);};

let cy, hidden = new Set();

async function loadStatus(){
  const m=document.getElementById('meta');
  try{ const s=await api('/api/status'); const c=s.counts||{}; const ps=s.projects||[]; clear(m);
    if(s.workspace){
      m.appendChild(el('span',{class:'k',text:`${ps.length} projects`}));
    }else{
      const p=ps[0]||{};
      m.appendChild(el('span',{class:'k',text:p.project||''}));
      if(p.branch)m.appendChild(el('span',{class:'pill',text:`${p.branch}@${p.head||''} ${p.dirty?'dirty':'clean'}`}));
      m.appendChild(el('span',{text:`index ${p.index||'n/a'}`}));
    }
    m.appendChild(el('span',{text:`${c.symbols} symbols · ${c.documents} docs · ${c.memory} memory · ${c.sessions} chats`}));
  }catch(e){ m.textContent='no project'; }
}

function styleSheet(){
  return [
    {selector:'node',style:{
      'background-color': n=>KIND[n.data('kind')]?.c||'#888',
      'width': n=>11+Math.min(n.degree(),22)*1.7, 'height': n=>11+Math.min(n.degree(),22)*1.7,
      'label':'data(label)','color':'#c8d3e0','font-size':6,'text-opacity':0,
      'min-zoomed-font-size':7,'text-wrap':'ellipsis','text-max-width':90,
      'border-width':0.5,'border-color':'#0e1116'}},
    {selector:'node[kind="module"],node[kind="document"],node[kind="memory"],node[kind="commit"],node[kind="session"]',style:{'text-opacity':1,'shape':'round-rectangle'}},
    {selector:'edge',style:{'width':1,'line-color':e=>EDGE[e.data('rel')]||'#39414f','curve-style':'haystack','opacity':0.55,
      'line-style':e=>(e.data('rel')==='MENTIONS'||e.data('rel')==='RELATED')?'dashed':'solid'}},
    {selector:'.hl',style:{'text-opacity':1,'border-width':2,'border-color':'#5cc8ff','z-index':99}},
    {selector:'.lbl',style:{'text-opacity':1}},
    {selector:'.hover',style:{'text-opacity':1,'min-zoomed-font-size':0,'font-size':9,'z-index':100,'border-width':1.5,'border-color':'#a371f7'}},
    {selector:'.faded',style:{'opacity':0.08,'text-opacity':0}},
    {selector:'.hide',style:{'display':'none'}},
    {selector:'.hidep',style:{'display':'none'}},
  ];
}

async function build(){
  const g = await api('/api/graph/full');
  const ids = new Set(g.nodes.map(n=>n.id));
  const elements = [];
  for(const n of g.nodes) elements.push({data:{...n}});
  let ei=0;
  for(const e of g.edges){ if(ids.has(e.source)&&ids.has(e.target)) elements.push({data:{id:'e'+(ei++),source:e.source,target:e.target,rel:e.rel}}); }

  cy = cytoscape({container:document.getElementById('cy'), elements, style:styleSheet(), minZoom:0.06, maxZoom:2.2,
    layout:{name:'cose',animate:false,fit:true,padding:40,nodeRepulsion:9000,idealEdgeLength:55,gravity:0.4,componentSpacing:70,nestingFactor:0.9,numIter:900}});
  // Fit to the viewport once layout settles (and after the container has its size).
  cy.one('layoutstop', ()=>{ cy.resize(); cy.fit(undefined, 40); });
  setTimeout(()=>{ cy.resize(); cy.fit(undefined, 40); }, 120);
  window.addEventListener('resize', ()=>{ cy.resize(); cy.fit(undefined, 40); });
  document.getElementById('loading').style.display='none';
  document.getElementById('count').textContent = `${g.nodes.length} nodes · ${ei} edges`;

  cy.on('tap','node', evt=>select(evt.target));
  cy.on('tap', evt=>{ if(evt.target===cy){ deselect(); } });
  cy.on('mouseover','node', e=>e.target.addClass('hover'));
  cy.on('mouseout','node', e=>e.target.removeClass('hover'));
  buildProjectFilters(g.projects||[]);
  buildFilters();
  buildEdgeFilters(g.edges);
  window.__cy = cy; // debug/testing handle

}

function select(node){
  cy.elements().addClass('faded');
  const hood = node.closedNeighborhood();
  hood.removeClass('faded'); hood.nodes().addClass('lbl'); node.addClass('hl');
  openDetail(node.data());
}
function deselect(){ cy.elements().removeClass('faded hl lbl'); document.getElementById('side').classList.remove('open'); }

// Project filters: one chip per project so you can toggle each store in/out of the view.
// Only shown when more than one project is open (single-project mode stays uncluttered).
let hiddenProjects = new Set();
function buildProjectFilters(projects){
  const f=document.getElementById('pfilters'); clear(f);
  document.getElementById('psep').style.display = projects.length>1 ? '' : 'none';
  if(projects.length<2) return;
  projects.forEach((p,i)=>{
    projectColor[p.key]=PROJECT_PALETTE[i%PROJECT_PALETTE.length];
    const sq=el('span',{class:'sq'}); sq.style.background=projectColor[p.key];
    const chip=el('span',{class:'chip',onClick:()=>toggleProject(p.key,chip)},[sq,el('span',{text:p.name})]);
    f.appendChild(chip);
  });
}
function toggleProject(key,chip){
  if(hiddenProjects.has(key)){ hiddenProjects.delete(key); chip.classList.remove('off'); }
  else { hiddenProjects.add(key); chip.classList.add('off'); }
  cy.nodes().forEach(n=> n.toggleClass('hidep', hiddenProjects.has(n.data('project'))));
}

function buildFilters(){
  const present = [...new Set(cy.nodes().map(n=>n.data('kind')))];
  const order = ['function','method','class','struct','enum','trait','interface','module','document','memory','session','commit'];
  const kinds = order.filter(k=>present.includes(k));
  const f=document.getElementById('filters'); clear(f);
  for(const k of kinds){
    const dot=el('span',{class:'dot'}); dot.style.background=KIND[k]?.c||'#888';
    const chip=el('span',{class:'chip',onClick:()=>toggleKind(k,chip)},[dot,el('span',{text:(KIND[k]?.label||k)})]);
    chip.dataset.kind=k; f.appendChild(chip);
  }
}
function toggleKind(k,chip){
  if(hidden.has(k)){ hidden.delete(k); chip.classList.remove('off'); } else { hidden.add(k); chip.classList.add('off'); }
  cy.nodes().forEach(n=> n.toggleClass('hide', hidden.has(n.data('kind'))));
}

// Edge-type filters: toggle DEFINES / CALLS / IMPORTS / CHANGED_BY / MENTIONS / RELATED /
// EVIDENCE so you can isolate, e.g., just the call graph or just file dependencies.
let edgeHidden = new Set();
function buildEdgeFilters(edges){
  const order = ['DEFINES','CALLS','IMPORTS','CHANGED_BY','MENTIONS','RELATED','EVIDENCE'];
  const present = new Set(edges.map(e=>e.rel));
  const f=document.getElementById('efilters'); clear(f);
  for(const rel of order.filter(r=>present.has(r))){
    const bar=el('span',{class:'bar'}); bar.style.background=EDGE[rel]||'#888';
    const chip=el('span',{class:'chip',onClick:()=>toggleEdge(rel,chip)},[bar,el('span',{text:rel.toLowerCase().replace('_',' ')})]);
    f.appendChild(chip);
  }
}
function toggleEdge(rel,chip){
  if(edgeHidden.has(rel)){ edgeHidden.delete(rel); chip.classList.remove('off'); } else { edgeHidden.add(rel); chip.classList.add('off'); }
  cy.edges('[rel="'+rel+'"]').toggleClass('hide', edgeHidden.has(rel));
}

document.getElementById('q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  cy.elements().removeClass('faded hl');
  if(!v) return;
  const match = cy.nodes().filter(n=>(n.data('label')||'').toLowerCase().includes(v) || (n.data('id')||'').toLowerCase().includes(v));
  if(!match.length) return;
  cy.elements().addClass('faded'); match.removeClass('faded').addClass('hl');
  cy.animate({fit:{eles:match,padding:80}},{duration:250});
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') deselect(); });
document.getElementById('close').addEventListener('click', deselect);

async function openDetail(d){
  const side=document.getElementById('side'), box=document.getElementById('detail'); clear(box);
  side.classList.add('open');
  // In multi-project mode, badge the node's project so it's clear which store it's from.
  if(d.projectName && Object.keys(projectColor).length){
    const dot=el('span',{class:'sq'}); dot.style.cssText='display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;background:'+(projectColor[d.project]||'#888');
    box.appendChild(el('div',{class:'sub'},[dot,el('span',{text:d.projectName})]));
  }
  const kind=d.kind;
  if(kind==='document'){ box.appendChild(el('h3',{text:d.label})); box.appendChild(el('div',{class:'sub',text:'document'})); return; }
  if(kind==='session'){ box.appendChild(el('h3',{text:d.label})); box.appendChild(el('div',{class:'sub',text:'agent session'})); return; }
  if(kind==='commit'){ box.appendChild(el('h3',{text:d.label})); box.appendChild(el('div',{class:'sub',text:'commit'})); return; }
  const pq = d.project ? '&project='+encodeURIComponent(d.project) : '';
  if(kind==='memory'){
    const m=await api('/api/memory?id='+d.ref+pq);
    box.appendChild(el('h3',{text:m.title||'memory'}));
    box.appendChild(el('div',{class:'sub',text:`${m.scope}/${m.type} · ${m.status} · ${m.created_at||''}`}));
    box.appendChild(el('pre',{text:m.content||''}));
    return;
  }
  // code symbol
  const s=await api('/api/symbol?id='+d.ref+pq);
  box.appendChild(el('h3',{text:s.qualified_name||d.label}));
  box.appendChild(el('div',{class:'sub',text:`${s.type} · ${s.file}:${s.start}-${s.end}`}));
  if(s.signature) box.appendChild(el('pre',{text:s.signature}));
  if(s.changes&&s.changes.length){ box.appendChild(el('div',{class:'meta',text:'recent changes'})); const ul=el('ul');
    for(const c of s.changes) ul.appendChild(el('li',{text:`${c.change}${c.commit?(' @'+String(c.commit).slice(0,8)):''}`})); box.appendChild(ul); }
  // jump to this node in the graph
  box.appendChild(el('div',{class:'meta',text:'click a connected node in the graph to follow relations'}));
}

// Live refresh: when `serve --watch` re-ingests a changed document, /api/version bumps
// and we rebuild the graph in place (no manual reload).
let lastVersion=null;
async function rebuild(){
  if(cy){ cy.destroy(); cy=null; }
  hidden=new Set(); edgeHidden=new Set(); hiddenProjects=new Set();
  document.getElementById('loading').style.display=''; document.getElementById('loading').textContent='rebuilding…';
  await loadStatus();
  await build();
}
async function pollVersion(){
  try{ const v=(await api('/api/version')).version;
    if(lastVersion===null) lastVersion=v;
    else if(v!==lastVersion){ lastVersion=v; await rebuild(); }
  }catch(e){}
}
setInterval(pollVersion, 4000);

loadStatus();
build().catch(e=>{ document.getElementById('loading').textContent='failed to build graph: '+e; });
</script>
</body>
</html>
